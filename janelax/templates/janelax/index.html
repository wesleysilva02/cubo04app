<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro do Usuário</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef5ff, #f9fbff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 760px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            color: #1d3557;
            font-size: 2rem;
        }

        .subtitle {
            color: #4a5568;
            margin-top: 8px;
            font-size: 1rem;
        }

        .badge {
            display: inline-block;
            background: #e8f1ff;
            color: #174ea6;
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 0.9rem;
            margin-top: 10px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid #edf2f7;
            vertical-align: top;
        }

        td:first-child {
            width: 32%;
            font-weight: 700;
            color: #1f2937;
            background: #f8fbff;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d8e1ee;
            border-radius: 10px;
            outline: none;
            font-size: 1rem;
            background: #fff;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .actions {
            margin-top: 25px;
            display: flex;
            justify-content: center;
        }

        button {
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 18px rgba(37, 99, 235, 0.2);
        }

        .mensagem {
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 10px;
            background: #ebfdf3;
            border: 1px solid #b7ebc7;
            color: #157347;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>OLÁ, {{ NOME_USUARIO }}!</h1>
            <div class="badge">Curso: {{ curso }}</div>
        </div>

        {% if mensagem %}
            <div class="mensagem">{{ mensagem }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <table>
                <tr>
                    <td>Nome completo</td>
                    <td><input type="text" name="nome" placeholder="Digite seu nome" required></td>
                </tr>
                <tr>
                    <td>E-mail</td>
                    <td><input type="email" name="email" placeholder="Digite seu e-mail" required></td>
                </tr>
                <tr>
                    <td>Telefone</td>
                    <td><input type="tel" name="telefone" placeholder="(99) 99999-9999"></td>
                </tr>
                <tr>
                    <td>Idade</td>
                    <td><input type="number" name="idade" min="0" placeholder="Digite sua idade"></td>
                </tr>
                <tr>
                    <td>Curso</td>
                    <td>
                        <select name="curso" required>
                            <option value="">Selecione</option>
                            <option value="Python">Python</option>
                            <option value="Django">Django</option>
                            <option value="JavaScript">JavaScript</option>
                            <option value="UX/UI">UX/UI</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Observações</td>
                    <td><textarea name="observacoes" placeholder="Digite alguma observação..."></textarea></td>
                </tr>
            </table>

            <div class="actions">
                <button type="submit">Salvar dados</button>
            </div>
        </form>
    </div>
</body>
</html>
