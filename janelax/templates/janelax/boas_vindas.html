<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boas-vindas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf4ff, #f6f9ff);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            width: 500px;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #1f3a5f;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            color: #333;
        }

        .nome {
            color: #0d6efd;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            background: #0d6efd;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Boas-vindas!</h1>
        <p>Olá, <span class="nome">{{ nome_usuario }}</span>!</p>
        <p>Seja bem-vindo ao curso de {{ curso }}.</p>
        <a href="{% url 'listar_usuarios' %}" class="btn">Ver lista de usuários</a>
    </div>
</body>
</html>
